[project]
name = "evaluationenginepython"
version = "0.1.0"
description = "Python port of the OpenML EvaluationEngine: dataset processing, meta-feature extraction, fold generation, and run evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "liac-arff>=2.5.0",
  "numpy>=2.4.6",
  "pandas>=3.0.3",
  "pymfe>=0.4.4",
  "pyarrow>=24.0.0",
  "requests>=2.34.2",
  "scikit-learn>=1.9.0",
  "scipy>=1.17.1",
  "xmltodict>=1.0.4",
]

[dependency-groups]
dev = [
  "black>=26.5.1",
  "isort>=8.0.1",
  "jupyter>=1.1.1",
  "jupyterlab-lsp>=5.3.0",
  "mkdocstrings-python>=1.18.0",
  "openml>=0.15.1",
  "pandas-stubs~=3.0.3",
  "parqet>=1.0.4",
  "pytest>=9.1.1",
  "pytest-mock>=3.15.1",
  "zensical>=0.0.67",
]

[tool.pytest.ini_options]
pythonpath = ["."]
