name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: evaluation-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke test (--help via entrypoint)
        run: docker run --rm evaluation-engine:ci --help
